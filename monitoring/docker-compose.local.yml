# 로컬 개발용 모니터링 스택 (Prometheus + Grafana).
# 배포 서버에는 이 파일을 올리지 않는다 — 서버용은 docker-compose.yml 이다.
#
# 배포용과 다른 점:
#   - 백엔드를 도커에 넣지 않는다. 호스트에서 ./gradlew bootRun 으로 띄운 것을
#     prometheus 가 host.docker.internal:8081 로 긁는다 (prometheus.local.yml).
#   - 공유 네트워크 symboorm 을 쓰지 않는다. compose 기본 네트워크로 충분하다.
#   - Grafana 자격증명을 파일에 박아둔다. .env 를 만들 필요가 없다.
#     3000 포트가 호스트에만 열리므로 배포와 달리 외부 노출 위험이 없다.
#
# 프로젝트명·컨테이너명·볼륨이 배포용과 분리되어 있어서, 혹시 같은 머신에서
# 두 스택을 동시에 띄워도 충돌하지 않는다.
#
# 사용법:
#   1) docker compose -f docker-compose.local.yml up -d
#   2) 다른 터미널에서: cd ../backend && ./gradlew bootRun
#   3) http://localhost:3000 접속 (admin / admin)
#
# 백엔드를 나중에 띄워도 된다. 그 전까지는 타깃이 down 으로 잡힐 뿐이다.

name: symboorm-monitoring-local

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: symboorm-prometheus-local
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Docker Desktop(macOS/Windows)은 없어도 되지만 Linux·WSL 에서는 필요하다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.0
    container_name: symboorm-grafana-local
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    # 배포와 같은 provisioning 을 그대로 쓴다. 데이터소스가 가리키는
    # http://prometheus:9090 은 여기서도 위 서비스명으로 해석된다.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
