# 배포 서버 prometheus 스크레이프 설정.
# 모니터링 스택은 백엔드와 다른 인스턴스에 뜨므로 도커 내부 DNS(backend:8081)로는
# 백엔드에 닿을 수 없다. 같은 VPC 안의 프라이빗 IP 로 직접 긁는다.
#
# 프라이빗 IP 는 VPC 밖에서 도달할 수 없으므로 공인 IP 를 쓰지 않는다.
# 백엔드 인스턴스 보안그룹에서 8081 을 모니터링 인스턴스 SG 로만 열어두어야 한다.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: symboorm-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['10.0.1.43:8001']
