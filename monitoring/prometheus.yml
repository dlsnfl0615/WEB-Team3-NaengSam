# 배포 서버 prometheus 스크레이프 설정.
# 백엔드 컨테이너의 management 포트(8081)를 도커 네트워크 내부에서 긁는다.
# backend 는 backend/docker-compose.yml 의 서비스명이다. compose 가 서비스명을
# 공유 네트워크(symboorm)의 별칭으로 등록하므로, 다른 compose 프로젝트인 이 스택에서도
# 도커 내부 DNS 로 해석된다.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: symboorm-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']
