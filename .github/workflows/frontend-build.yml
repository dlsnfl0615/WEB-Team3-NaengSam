name: Frontend Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        # --ignore-scripts: pnpm 11이 승인되지 않은 빌드 스크립트(esbuild 등)에 ERR_PNPM_IGNORED_BUILDS로
        # 실패하므로 생략한다. esbuild·tailwind·rolldown은 prebuilt 바이너리(optional dep)라 빌드 스크립트가 불필요.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
