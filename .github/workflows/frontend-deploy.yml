name: Frontend Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        # --ignore-scripts: pnpm 11이 승인되지 않은 빌드 스크립트(esbuild 등)에 ERR_PNPM_IGNORED_BUILDS로
        # 실패하므로 생략한다. esbuild·tailwind·rolldown은 prebuilt 바이너리(optional dep)라 빌드 스크립트가 불필요.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build
        env:
          # 비어 있으면 상대경로(/api/v1/...) — CloudFront가 /api를 EC2 백엔드로 프록시하는 동일-출처 구성.
          # 백엔드가 별도 도메인(cross-origin)일 때만 리포지토리 secret에 백엔드 오리진을 넣는다.
          # (Vite는 빌드 시 VITE_ 접두 변수를 process.env에서 읽어 번들에 인라인한다. working-directory와 무관.)
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_MAP_KEY=: ${{ secrets.VITE_KAKAO_MAP_KEY }}

      # GitHub Actions 러너 IP에서는 S3 접근이 차단되어 있으므로, 빌드 산출물을 EC2로 보낸 뒤
      # EC2에서 IAM 인스턴스 롤로 S3에 업로드한다. (러너에는 AWS 자격증명을 두지 않는다)
      - name: Upload dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist"
          target: "/tmp/frontend-deploy"
          strip_components: 1   # frontend/ 접두 제거 → /tmp/frontend-deploy/dist/<파일>

      - name: Deploy to S3 from EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: S3_BUCKET,CLOUDFRONT_DISTRIBUTION_ID
          script: |
            set -euo pipefail
            SRC=/tmp/frontend-deploy/dist

            # 조직 SCP가 s3:ListBucket을 명시적으로 거부하므로 `s3 sync`(비교 시 ListBucket 필요) 대신
            # `s3 cp --recursive`(업로드=PutObject만 사용, ListBucket 불필요)를 사용한다.
            # 트레이드오프: --delete를 못 쓰므로 과거 에셋이 버킷에 남지만, 콘텐츠 해시 파일명이라 충돌 없음.
            # 콘텐츠 해시가 붙은 정적 에셋(assets/*, workbox-*.js): 1년 immutable 캐시
            aws s3 cp "$SRC/" "s3://$S3_BUCKET" \
              --recursive \
              --cache-control "public,max-age=31536000,immutable" \
              --exclude "index.html" \
              --exclude "sw.js" \
              --exclude "registerSW.js" \
              --exclude "manifest.webmanifest"
            # 항상 최신(재검증 대상): index.html + 서비스워커/등록 스크립트 + 매니페스트
            # 해시가 없는 파일이라 오래 캐시하면 PWA 업데이트가 사용자에게 전달되지 않는다.
            aws s3 cp "$SRC/index.html" "s3://$S3_BUCKET/index.html" \
              --cache-control "no-cache,no-store,must-revalidate"
            aws s3 cp "$SRC/sw.js" "s3://$S3_BUCKET/sw.js" \
              --cache-control "no-cache,no-store,must-revalidate"
            aws s3 cp "$SRC/registerSW.js" "s3://$S3_BUCKET/registerSW.js" \
              --cache-control "no-cache,no-store,must-revalidate"
            aws s3 cp "$SRC/manifest.webmanifest" "s3://$S3_BUCKET/manifest.webmanifest" \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/manifest+json"

            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/*"

            rm -rf "$SRC"
