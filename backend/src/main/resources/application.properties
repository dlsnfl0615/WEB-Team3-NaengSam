spring.application.name=quick

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.sql.init.mode=always

# 매 실행마다 기존 테이블 제거(drop.sql) 후 DDL 재적용
#spring.sql.init.schema-locations=classpath:drop.sql,file:./sql/sym-boorm-ddl.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SOLAPI(SMS) - 로컬은 solapi.enabled=false 로 LoggingSmsSender 사용(크레덴셜 불필요).
solapi.enabled=${SOLAPI_ENABLED}
solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.from=${SOLAPI_FROM}

# 웹푸시(VAPID) - 기본 false 로 두어 키 없이도 뜬다. false 면 WebPushSender 빈이 등록되지 않아 웹푸시 채널을 건너뛰고,
# 공개키 조회 API 가 null 을 반환해 프론트도 구독을 시도하지 않는다(백엔드 환경변수만으로 on/off).
# 키 쌍은 저장소 밖에서 한 번 생성한다: npx web-push generate-vapid-keys
web-push.enabled=${WEB_PUSH_ENABLED:false}
web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
web-push.subject=${WEB_PUSH_SUBJECT:mailto:noreply@symboorm.com}

# 카카오 로컬(좌표변환)/도보 길찾기 API - 로컬·부하테스트는 kakao.enabled=false 로 Dev* 구현 사용(크레덴셜 불필요).
# 기본값이 true 인 이유: 설정을 빠뜨렸을 때 조용히 가짜 좌표로 도는 것보다 실 API 로 도는 편이 안전하다.
kakao.enabled=${KAKAO_ENABLED:true}

# s3 업로드 용도 - 로컬은 upload.s3-enabled=false 로 DevUploader 사용(크레덴셜 불필요).
upload.s3-enabled=${UPLOAD_S3_ENABLED:false}
upload.bucket-name=${BUCKET_NAME}

logging.level.com.naengsam.quick=${LOG_LEVEL:INFO}

# CORS - 콤마 구분 오리진 목록. 로컬 기본값은 Vite dev 서버, 운영은 CORS_ALLOWED_ORIGINS 환경변수로 주입.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 세션 쿠키 - 크로스오리진 전송을 위해 SameSite=None; Secure.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# 휴대폰 인증 튜닝값. 인증번호 유효기간/쿨다운/인증완료 유지, 검증 시도 제한(brute-force),
# 발송 남용 방지용 번호/전역 rate limit(단일 인스턴스 인메모리, best-effort).
verification.code-ttl=5m
verification.resend-cooldown=60s
verification.verified-ttl=30m
verification.max-verify-attempts=5
verification.phone-window=24h
verification.phone-max=5
verification.global-window=24h
verification.global-max=1000

# SSE - heartbeat로 프록시/브라우저에 죽은 유령 연결을 정리한다. connection-timeout은 heartbeat가 없던 시절의
# emitter 자체 타임아웃(안전망)이라 heartbeat-interval보다 훨씬 길게 둔다.
sse.heartbeat-interval=25s
sse.connection-timeout=1h
# 사용자당 동시 SSE 연결(=열린 탭) 상한. 초과 구독은 새 emitter를 등록하지 않고 거부(204)해 자원 고갈을 막는다.
sse.max-connections-per-user=5

# 드리미 GPS 끊김 감지 - 드리미는 5초마다 위치를 보내므로 threshold 30s = 6회 연속 누락이다.
# 엘리베이터·터널 같은 순간 단절에는 배너가 뜨지 않고, 실제 이탈은 30초 내에 인지된다.
# 스캔 간격이 곧 감지 지연의 상한이다(실제 지연 = threshold + 최대 scan-interval).
delivery.dreami-offline-threshold=30s
delivery.dreami-offline-scan-interval=5s

# 드리미 장시간 무소식 SMS - 위 배너·웹푸시(30s)로도 복구되지 않은 배달의 마지막 보조 채널.
# 유료 채널이므로 킬 스위치를 기본 false 로 두고, 실제 번호로 수동 E2E 를 통과한 뒤에만 켠다.
# 로컬 확인은 SMS_FALLBACK_ENABLED=true + SOLAPI_ENABLED=false 조합 — DevSmsSender 가 문자 대신 로그만 남긴다.
# 임계값 3m = 5초 간격 36회 연속 누락. 앱이 죽었거나 배터리가 끝났거나 라이더가 이탈한 상태이며,
# 배너로는 고칠 수 없고 문자로는 고칠 수 있는 유일한 구간이다. 배달당 1건(offline_sms_sent_dtm)으로 제한된다.
notification.sms-fallback-enabled=${SMS_FALLBACK_ENABLED:false}
notification.dreami-offline-sms-threshold=3m

# 매칭 정책 - 기존 동작(legacy MatchingService.attemptOfferRound)에 가장 가까운 조합을 기본값으로 둔다.
# 부하 테스트 프로필(application-loadtest.properties)에서는 SCORE_BASED_GREEDY/BALANCED/OUTCOME_COOLDOWN 조합으로 교체한다.
# matching.batch-window -> matching.batch-interval 개명(E11). 기존 키(환경변수 MATCHING_BATCH_WINDOW 포함)를
# 아직 쓰는 배포가 있을 수 있어, 한 버전 동안은 기존 키 값을 fallback으로 그대로 읽는다. 다음 정리 때 제거한다.
matching.batch-interval=${matching.batch-window:1s}
matching.max-concurrent-offers=3
matching.offer-quota-mode=${OFFER_QUOTA_MODE:DYNAMIC}
matching.dynamic-quota-max=${DYNAMIC_QUOTA_MAX:5}
matching.assignment-policy=${ASSIGNMENT_POLICY:SCORE_BASED_GREEDY}
matching.scoring-policy=${SCORING_POLICY:BALANCED}
matching.eligibility-policy=${ELIGIBILITY_POLICY:OUTCOME_COOLDOWN}
matching.cooldown.dreami-rejection=10m
matching.cooldown.boormi-rejection=10m
matching.cooldown.dreami-expiration=10m
matching.balanced-weights.distance-weight=1
matching.balanced-weights.order-wait-weight=1
matching.balanced-weights.dreami-wait-weight=1
matching.balanced-weights.max-matching-distance=3000
matching.balanced-weights.target-order-wait=5m
matching.balanced-weights.target-dreami-wait=5m

# 모니터링 - 액츄에이터는 별도 포트(8081)로 분리한다. compose 에서 이 포트를 호스트에 공개하지 않아
# 같은 도커 네트워크의 prometheus 만 접근할 수 있다(공인 IP 로 메트릭이 새지 않음).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# HTTP 지연 히스토그램 - Grafana 에서 p95/p99 를 계산하려면 _bucket 시계열이 필요하다.
# 상한을 10s 로 낮춰 버킷 수를 줄인다. 하한은 1ms 로 둔다 - 대부분의 API 가 10ms 미만이라
# 하한을 10ms 로 올리면 p95 가 전부 첫 버킷에 뭉쳐 엔드포인트 간 비교가 안 된다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
# 설정 키는 prefix 매칭이라 http.server.requests.active(진행 중 요청 LongTaskTimer)까지 딸려온다.
# 진행 중 요청은 개수만 보면 되고, 히스토그램을 켜면 _active_count 가 _gcount 로 바뀌어 쿼리가 깨진다.
management.metrics.distribution.percentiles-histogram.http.server.requests.active=false
