spring.application.name=quick

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.sql.init.mode=always

# 매 실행마다 기존 테이블 제거(drop.sql) 후 DDL 재적용
#spring.sql.init.schema-locations=classpath:drop.sql,file:./sql/sym-boorm-ddl.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false

# SOLAPI(SMS) - 로컬은 solapi.enabled=false 로 LoggingSmsSender 사용(크레덴셜 불필요).
solapi.enabled=${SOLAPI_ENABLED}
solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.from=${SOLAPI_FROM}

logging.level.com.naengsam.quick=DEBUG
