spring.application.name=quick

# H2 datasource
spring.datasource.url=jdbc:h2:mem:naengsam;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Build the schema only from the project's DDL script.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./sql/sym-boorm-ddl.sql

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
