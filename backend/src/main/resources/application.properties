spring.application.name=quick

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# 커넥션 풀(HikariCP) - 전부 기본값과 다르거나, 같더라도 "검토한 값"임을 남겨야 하는 항목이다.
# maximum-pool-size 는 기본값과 같은 10 을 그대로 둔다. 외부 API 호출을 트랜잭션 밖으로 뺀 뒤
# 주문 트랜잭션의 커넥션 점유는 insert + 결제로 5~10ms 수준이라, 초당 20건이어도 동시 점유는 0.2개다.
# 풀을 키우면 대기열이 MySQL 쪽으로 옮겨갈 뿐이라 이 이슈의 해법이 아니다(#437).
# minimum-idle 을 max 와 같게 두어 고정 크기 풀로 만든다 - 스파이크마다 풀이 줄었다 늘어나지 않는다.
# connection-timeout 은 기본 30s 를 3s 로 줄인다. 30s 는 풀이 마르는 순간 톰캣 스레드가 전부 30초씩
# 대기해 앱 전체가 멈추지만, 3s 면 빠른 실패로 바뀌어 과부하를 흘려보낼 수 있다. 정상 쿼리는 수십 ms 다.
# leak-detection-threshold 는 커넥션을 5초 넘게 쥔 스레드의 스택트레이스를 WARN 으로 남긴다.
# 외부 호출이 다시 트랜잭션 안으로 들어오는 회귀를 즉시 드러내는 알람이다.
spring.datasource.hikari.pool-name=symboorm-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.leak-detection-threshold=5000

spring.sql.init.mode=always

# 매 실행마다 기존 테이블 제거(drop.sql) 후 DDL 재적용
#spring.sql.init.schema-locations=classpath:drop.sql,file:./sql/sym-boorm-ddl.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SOLAPI(SMS) - 로컬은 solapi.enabled=false 로 LoggingSmsSender 사용(크레덴셜 불필요).
solapi.enabled=${SOLAPI_ENABLED}
solapi.api-key=${SOLAPI_API_KEY}
solapi.api-secret=${SOLAPI_API_SECRET}
solapi.from=${SOLAPI_FROM}

# 웹푸시(VAPID) - 기본 false 로 두어 키 없이도 뜬다. false 면 WebPushSender 빈이 등록되지 않아 웹푸시 채널을 건너뛰고,
# 공개키 조회 API 가 null 을 반환해 프론트도 구독을 시도하지 않는다(백엔드 환경변수만으로 on/off).
# 키 쌍은 저장소 밖에서 한 번 생성한다: npx web-push generate-vapid-keys
web-push.enabled=${WEB_PUSH_ENABLED:false}
web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
web-push.subject=${WEB_PUSH_SUBJECT:mailto:noreply@symboorm.com}

# 카카오 로컬(좌표변환)/도보 길찾기 API - 로컬·부하테스트는 kakao.enabled=false 로 Dev* 구현 사용(크레덴셜 불필요).
# 기본값이 true 인 이유: 설정을 빠뜨렸을 때 조용히 가짜 좌표로 도는 것보다 실 API 로 도는 편이 안전하다.
kakao.enabled=${KAKAO_ENABLED:true}
# Dev* 스텁의 인위적 지연. 카카오 쿼터를 쓰지 않고 "느린 외부 API" 를 로컬에서 재현할 때만 쓴다
# (예: KAKAO_DEV_LATENCY=2s → 주문 1건이 스텁 3회 × 2s = 6초, 배포 부하테스트 관측치와 같다).
# kakao.enabled=false 일 때만 등록되는 빈이라 운영 경로에는 영향이 없다.
kakao.dev-latency=${KAKAO_DEV_LATENCY:0ms}
# DevCoordinatesService가 주소를 어느 범위에 떨어뜨릴지. gangnam(기본)은 강남 일대 2.5km 격자 하나로,
# 클라이언트의 "근방 3km" 화면이 정상 동작하는 범위다. national은 전국 16개 도시에 흩뿌린다 —
# 전국 분산 부하테스트(matchingtest-cell)에서만 켠다. 일반 로컬 개발에서 켜면 주문이 지도에서 사라진다.
kakao.dev-zone-mode=${KAKAO_DEV_ZONE_MODE:gangnam}
# 카카오 응답 캐시(#435). 같은 주소·같은 경로를 한 주문 흐름에서 여러 번 물어보던 중복 호출을 Redis 로 막는다.
# TTL 이 비대칭인 이유: 주소→좌표는 사실상 불변이고 값이 400B 대라 길게 잡아도 싸지만, 경로는 폴리라인 때문에
# 5~15KB 라 히트율보다 메모리 상한이 우선이다. 중복 호출 자체가 한 흐름 안(초~분)에서 벌어져 1시간이면 다 잡힌다.
# 0(또는 음수)으로 두면 해당 캐시를 통째로 건너뛴다 — 재배포 없이 끄는 킬 스위치.
# 주의: 로그인 대기열과 같은 Redis 인스턴스이고 그쪽은 maxmemory-policy=noeviction 이다. 메모리가 모자라면
# 정책을 allkeys-*/volatile-* 로 바꾸지 말고(대기열 티켓이 evict 되어 대기자가 조용히 사라진다) TTL 을 줄이거나
# maxmemory 를 올린다. 자세한 내용은 redis/README.md.
kakao.cache.geocode-ttl=${KAKAO_GEOCODE_TTL:7d}
kakao.cache.route-ttl=${KAKAO_ROUTE_TTL:1h}

# s3 업로드 용도 - 로컬은 upload.s3-enabled=false 로 DevUploader 사용(크레덴셜 불필요).
upload.s3-enabled=${UPLOAD_S3_ENABLED:false}
upload.bucket-name=${BUCKET_NAME}

logging.level.com.naengsam.quick=${LOG_LEVEL:INFO}

# CORS - 콤마 구분 오리진 목록. 로컬 기본값은 Vite dev 서버, 운영은 CORS_ALLOWED_ORIGINS 환경변수로 주입.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 세션 쿠키 - 크로스오리진 전송을 위해 SameSite=None; Secure.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# 톰캣 워커 스레드 상한. 기본값 200(+@)이라 배포 인스턴스에서 스레드가 246개까지 떴고,
# 스택 1개당 1MB 라 246MB 로 메모리 예산에서 가장 큰 덩어리였다(compose 에서 -Xss512k 와 함께 조정).
# 줄여도 동시성은 떨어지지 않는다. 실효 동시성 상한을 정하는 건 vCPU 2 와 Hikari 풀(10)이고,
# 2026-08-13 부하테스트에서 스레드 246개 중 러너블은 20개, 나머지 187개는 BLOCKED 였다.
# 리틀의 법칙으로도 20 req/s × 2s = 40개면 충분하므로 100은 4배 여유다.
# SSE 는 Servlet async 라 톰캣 워커를 점유하지 않으므로 이 상한과 무관하다.
server.tomcat.threads.max=100
server.tomcat.accept-count=100

# 휴대폰 인증 튜닝값. 인증번호 유효기간/쿨다운/인증완료 유지, 검증 시도 제한(brute-force),
# 발송 남용 방지용 번호/전역 rate limit(단일 인스턴스 인메모리, best-effort).
verification.code-ttl=5m
verification.resend-cooldown=60s
verification.verified-ttl=30m
verification.max-verify-attempts=5
verification.phone-window=24h
verification.phone-max=5
verification.global-window=24h
verification.global-max=1000

# Redis - 로그인 대기열(순번/상태) 저장소로만 쓴다. 세션은 여전히 톰캣 인메모리다.
# 같은 VPC 의 별도 인스턴스에 두므로 REDIS_PASSWORD 는 운영에서 반드시 채운다(보안그룹 제한과 한 세트).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:300ms}

# 로그인 대기열 - PBKDF2 210,000 회 연산이 CPU 바운드라 동시 해싱 개수를 vCPU 수로 묶는다.
# 대기열은 처리량을 올리지 못한다(천장은 vCPU 수 / 해시 시간 그대로). 로그인 폭주가 나머지 API 를
# 굶기지 않게 격리하고, 사용자에게 순번과 예상 시간을 보여주는 것이 목적이다.
# estimated-hash-duration 은 ETA·폴링 주기 산식의 입력값으로, login.hash 타이머 실측 p50 으로 맞춘다.
login.queue.permits=2
login.queue.capacity=500
login.queue.ticket-ttl=2m
login.queue.ready-ttl=30s
login.queue.estimated-hash-duration=150ms

# SSE - heartbeat로 프록시/브라우저에 죽은 유령 연결을 정리한다. connection-timeout은 heartbeat가 없던 시절의
# emitter 자체 타임아웃(안전망)이라 heartbeat-interval보다 훨씬 길게 둔다.
sse.heartbeat-interval=25s
sse.connection-timeout=1h

# 드리미 GPS 끊김 감지 - 드리미는 5초마다 위치를 보내므로 threshold 30s = 6회 연속 누락이다.
# 엘리베이터·터널 같은 순간 단절에는 배너가 뜨지 않고, 실제 이탈은 30초 내에 인지된다.
# 스캔 간격이 곧 감지 지연의 상한이다(실제 지연 = threshold + 최대 scan-interval).
delivery.dreami-offline-threshold=30s
delivery.dreami-offline-scan-interval=5s

# 배송완료예상시간(사용자 노출)에 더하는 여유 시간. 카카오 경로는 도로 기준 이동 시간만 주므로,
# 건물 진입·엘리베이터 대기·수령인 대면처럼 경로에 안 잡히는 시간을 이 값으로 보정한다.
# 드리미의 첫 위치 전송 때 한 번만 계산되는 고정 스냅샷에 반영되므로 중복 가산되지 않는다.
# 0s 로 두면 보정 없이 '픽업까지 시간 + delivery_eta' 그대로 노출된다.
delivery.completion-buffer=5m

# 드리미 장시간 무소식 SMS - 위 배너·웹푸시(30s)로도 복구되지 않은 배달의 마지막 보조 채널.
# 유료 채널이므로 킬 스위치를 기본 false 로 두고, 실제 번호로 수동 E2E 를 통과한 뒤에만 켠다.
# 로컬 확인은 SMS_FALLBACK_ENABLED=true + SOLAPI_ENABLED=false 조합 — DevSmsSender 가 문자 대신 로그만 남긴다.
# 임계값 3m = 5초 간격 36회 연속 누락. 앱이 죽었거나 배터리가 끝났거나 라이더가 이탈한 상태이며,
# 배너로는 고칠 수 없고 문자로는 고칠 수 있는 유일한 구간이다. 배달당 1건(offline_sms_sent_dtm)으로 제한된다.
notification.sms-fallback-enabled=${SMS_FALLBACK_ENABLED:false}
notification.dreami-offline-sms-threshold=3m

# 매칭 정책 - 기존 동작(legacy MatchingService.attemptOfferRound)에 가장 가까운 조합을 기본값으로 둔다.
# 부하 테스트 프로필(application-loadtest.properties)에서는 SCORE_BASED_GREEDY/BALANCED/OUTCOME_COOLDOWN 조합으로 교체한다.
# matching.batch-window -> matching.batch-interval 개명(E11). 기존 키(환경변수 MATCHING_BATCH_WINDOW 포함)를
# 아직 쓰는 배포가 있을 수 있어, 한 버전 동안은 기존 키 값을 fallback으로 그대로 읽는다. 다음 정리 때 제거한다.
matching.batch-interval=${matching.batch-window:1s}
matching.max-concurrent-offers=3
matching.offer-quota-mode=${OFFER_QUOTA_MODE:DYNAMIC}
matching.dynamic-quota-max=${DYNAMIC_QUOTA_MAX:5}
matching.assignment-policy=${ASSIGNMENT_POLICY:SCORE_BASED_GREEDY}
matching.scoring-policy=${SCORING_POLICY:BALANCED}
matching.eligibility-policy=${ELIGIBILITY_POLICY:OUTCOME_COOLDOWN}
matching.cooldown.dreami-rejection=10m
matching.cooldown.boormi-rejection=10m
matching.cooldown.dreami-expiration=10m
matching.balanced-weights.distance-weight=1
matching.balanced-weights.order-wait-weight=1
matching.balanced-weights.dreami-wait-weight=1
matching.balanced-weights.max-matching-distance=6000
matching.balanced-weights.target-order-wait=5m
matching.balanced-weights.target-dreami-wait=5m
# 주문 대기시간이 길어질수록 드리미 탐색을 허용할 최대 픽업거리를 넓힌다.
matching.offer-scopes[0].min-order-wait=0s
matching.offer-scopes[0].max-pickup-distance-meters=2000
matching.offer-scopes[1].min-order-wait=30s
matching.offer-scopes[1].max-pickup-distance-meters=3000
matching.offer-scopes[2].min-order-wait=60s
matching.offer-scopes[2].max-pickup-distance-meters=6000

# 모니터링 - 액츄에이터는 별도 포트(8081)로 분리한다. compose 에서 이 포트를 호스트에 공개하지 않아
# 같은 도커 네트워크의 prometheus 만 접근할 수 있다(공인 IP 로 메트릭이 새지 않음).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
# Redis 장애를 health DOWN 으로 올리지 않는다. 대기열이 비어 있으면 인라인 경로로 로그인이 계속 되는데,
# 헬스체크가 DOWN 이면 살아 있는 인스턴스가 LB 에서 빠지거나 재시작된다. 관측은 login_queue_* 메트릭으로 한다.
management.health.redis.enabled=false
management.metrics.tags.application=${spring.application.name}
# HTTP 지연 히스토그램 - Grafana 에서 p95/p99 를 계산하려면 _bucket 시계열이 필요하다.
# 상한을 10s 로 낮춰 버킷 수를 줄인다. 하한은 1ms 로 둔다 - 대부분의 API 가 10ms 미만이라
# 하한을 10ms 로 올리면 p95 가 전부 첫 버킷에 뭉쳐 엔드포인트 간 비교가 안 된다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
# 설정 키는 prefix 매칭이라 http.server.requests.active(진행 중 요청 LongTaskTimer)까지 딸려온다.
# 진행 중 요청은 개수만 보면 되고, 히스토그램을 켜면 _active_count 가 _gcount 로 바뀌어 쿼리가 깨진다.
management.metrics.distribution.percentiles-histogram.http.server.requests.active=false
# 커넥션 점유 시간 히스토그램 - 외부 API 호출을 트랜잭션 밖으로 뺀 효과(초 단위 → ms 단위)를
# Grafana 에서 p95 로 확인하려면 _bucket 시계열이 필요하다.
management.metrics.distribution.percentiles-histogram.hikaricp.connections.usage=true
