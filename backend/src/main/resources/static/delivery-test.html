<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>배달 시각 테스트 콘솔</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root {
      --bg: #0f1117; --panel: #1a1d27; --panel2: #14171f; --border: #2a2e3a; --text: #e6e8ee;
      --muted: #8b90a0; --accent: #4f8cff; --ok: #22c55e; --warn: #f59e0b; --err: #ef4444;
      --dreami: #4f8cff; --boormi: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }

    header { padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; gap: 12px; flex-wrap: wrap; flex: 0 0 auto; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; margin-right: 4px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700;
      font-size: 12px; letter-spacing: .3px; }
    .s-none { background: #2a2e3a; color: var(--muted); }
    .s-pickup { background: #3a3f4b; color: #cdd2df; }
    .s-delivering { background: #1e3a6b; color: #9dc0ff; }
    .s-delivered { background: #14532d; color: #86efac; }
    .s-cancelled { background: #4a1d22; color: #fca5a5; }

    input[type=text], input[type=number] { background: #0f1117; border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
    button { background: #262a36; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { background: #3a2226; border-color: #5a2a30; }
    button.danger:hover { border-color: var(--err); }
    .toggle-on { background: var(--ok) !important; border-color: var(--ok) !important; color: #05240f !important; }

    /* ===== 무대: 드리미 | 부르미 두 화면 ===== */
    .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 18px; flex: 0 0 auto; }
    @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }
    .phone { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column; }
    .phone-head { padding: 9px 14px; font-weight: 700; font-size: 14px; display: flex;
      align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
    .phone.dreami .phone-head { color: #cddfff; background: linear-gradient(90deg, #14203a, transparent); }
    .phone.boormi .phone-head { color: #c7f2d5; background: linear-gradient(90deg, #123420, transparent); }
    .phone-head .tag { font-size: 11px; font-weight: 500; color: var(--muted); }
    .map { width: 100%; height: 190px; background: #222; }
    .phone-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .field { font-size: 11px; color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .status-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; text-align: center; }
    .status-card .big { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .status-card .sub { font-size: 12px; color: var(--muted); min-height: 16px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

    /* ===== 콘솔 (크게) ===== */
    .console { flex: 1 1 auto; min-height: 180px; display: flex; flex-direction: column;
      border-top: 1px solid var(--border); overflow: hidden; }
    .console-head { padding: 7px 18px; font-size: 12px; color: var(--muted); display: flex;
      justify-content: space-between; align-items: center; background: var(--panel2); }
    .log { flex: 1 1 auto; overflow-y: auto; padding: 10px 18px; font-family: ui-monospace, Menlo, monospace;
      font-size: 12.5px; line-height: 1.55; }
    .log-item { padding: 8px 12px; border-radius: 6px; margin-bottom: 7px; background: var(--panel2);
      border-left: 3px solid var(--border); white-space: pre-wrap; word-break: break-all; }
    .log-item.ok { border-left-color: var(--ok); }
    .log-item.err { border-left-color: var(--err); }
    .log-item .t { color: var(--muted); }
    .log-item .side-d { color: #9dc0ff; font-weight: 700; }
    .log-item .side-b { color: #86efac; font-weight: 700; }
    .log-item .code-ok { color: var(--ok); }
    .log-item .code-err { color: var(--err); font-weight: 700; }
    .hint { font-size: 10.5px; color: var(--muted); }

    /* ===== 모달 & 토스트 ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
      align-items: center; justify-content: center; z-index: 1000; }
    .hidden { display: none !important; }
    .modal { width: 340px; max-width: 90vw; background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: pop .18s ease-out; }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-head { padding: 12px 16px; font-weight: 700; font-size: 14px; color: #fff; }
    .modal-head.to-dreami { background: #1e3a6b; }
    .modal-head.to-boormi { background: #14532d; }
    .modal-head.to-error  { background: #4a1d22; }
    .modal-body { padding: 16px; font-size: 14px; line-height: 1.5; }
    .modal-json { padding: 0 16px 12px; }
    .modal-json pre { margin: 0; background: var(--panel2); border-radius: 8px; padding: 10px;
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted);
      max-height: 130px; overflow: auto; }
    .modal-foot { padding: 0 16px 16px; text-align: right; }

    #toasts { position: fixed; top: 14px; right: 14px; z-index: 1100; display: flex;
      flex-direction: column; gap: 8px; }
    .toast { background: #14171f; border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 8px 12px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      animation: pop .15s ease-out; }
  </style>
</head>
<body>
  <header>
    <h1>🛵 배달 시각 테스트</h1>
    <button class="primary" id="btnSeed">＋ 배달 시작 (seed)</button>
    <input type="text" id="orderId" placeholder="orderId (seed 시 자동)" style="width:270px"/>
    <span class="badge s-none" id="statusBadge">배달 없음</span>
    <span class="mono" id="statusMsg" style="color:var(--muted)"></span>
    <span style="flex:1"></span>
    <button id="btnClear">로그 지우기</button>
  </header>

  <div class="stage">
    <!-- ===== 드리미(배달원) 화면 ===== -->
    <div class="phone dreami">
      <div class="phone-head">🛵 드리미 (배달원) <span class="tag">— 내 위치를 전송하고 배달을 진행</span></div>
      <div id="mapD" class="map"></div>
      <div class="phone-body">
        <div class="row">
          <span class="field">위치</span>
          <input type="number" step="0.00000001" id="lat" placeholder="위도" style="flex:1"/>
          <input type="number" step="0.00000001" id="lng" placeholder="경도" style="flex:1"/>
        </div>
        <div class="row">
          <button class="primary" id="btnLoc" style="flex:1">📍 위치 업데이트</button>
          <button id="btnAuto">▶ 자동 이동(동쪽)</button>
        </div>
        <div class="hint">자동 이동 ON → 5초마다 경도를 조금씩 늘려 동쪽으로 전진(지도·API 동시).</div>
        <div class="btn-grid">
          <button id="btnPickup">✅ 픽업 완료</button>
          <button id="btnFinish">🏁 배달 완료</button>
          <button class="danger" id="btnCancelDreami" style="grid-column:1/3">취소 · 드리미</button>
        </div>
      </div>
    </div>

    <!-- ===== 부르미(주문자) 화면 ===== -->
    <div class="phone boormi">
      <div class="phone-head">🏠 부르미 (주문자) <span class="tag">— 배달원 위치를 추적하고 알림을 받음</span></div>
      <div id="mapB" class="map"></div>
      <div class="phone-body">
        <div class="status-card">
          <div class="big" id="bStatus">배달 대기 중</div>
          <div class="sub" id="bSub">주문을 시작하면 배달원 위치가 표시됩니다.</div>
        </div>
        <div class="btn-grid">
          <button class="danger" id="btnCancelBoormi">취소 · 부르미</button>
          <button class="danger" id="btnCancelAdmin">취소 · 관리자</button>
        </div>
      </div>
    </div>
  </div>

  <div class="console">
    <div class="console-head"><span>📟 콘솔 — 요청/응답 로그</span><span class="hint">최신이 위</span></div>
    <div class="log" id="log"></div>
  </div>

  <!-- 모달 -->
  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <div class="modal-head" id="modalHead">알림</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-json"><pre id="modalJson"></pre></div>
      <div class="modal-foot"><button class="primary" id="modalClose">확인</button></div>
    </div>
  </div>
  <div id="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    const STATUS_META = {
      PICKUP_NORMAL:              { label: "픽업중(정상)",     cls: "s-pickup",     cust: "배달원이 상품을 픽업하는 중" },
      DELIVERING:                 { label: "배달중",           cls: "s-delivering", cust: "배달원이 오고 있어요 🛵" },
      DELIVERED:                  { label: "배달 완료",        cls: "s-delivered",  cust: "배달이 완료되었어요 ✅" },
      PICKUP_CANCELLED_BY_BOORMI: { label: "픽업취소(부르미)", cls: "s-cancelled",  cust: "주문이 취소되었어요" },
      PICKUP_CANCELLED_BY_DREAMI: { label: "픽업취소(드리미)", cls: "s-cancelled",  cust: "배달원이 취소했어요" },
      PICKUP_CANCELLED_BY_ADMIN:  { label: "픽업취소(관리자)", cls: "s-cancelled",  cust: "관리자에 의해 취소되었어요" },
    };

    // ===== 지도 2개 (드리미: 조작 / 부르미: 추적) =====
    const START = [37.49795, 127.02760];
    const AUTO_STEP = 0.0004; // 한 틱당 동쪽으로 이동하는 경도 증가량(≈35m)

    const mapD = L.map('mapD').setView(START, 15);
    const mapB = L.map('mapB').setView(START, 15);
    [mapD, mapB].forEach(m => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom: 19, attribution: '© OSM' }).addTo(m));
    const markerD = L.marker(START, { draggable: true }).addTo(mapD);
    const markerB = L.marker(START).addTo(mapB).bindTooltip("배달원", { permanent: false });
    setTimeout(() => { mapD.invalidateSize(); mapB.invalidateSize(); }, 200);

    function setLatLng(lat, lng) {
      $('lat').value = Number(lat).toFixed(8);
      $('lng').value = Number(lng).toFixed(8);
    }
    function moveMarkers(lat, lng, pan) {
      markerD.setLatLng([lat, lng]);
      markerB.setLatLng([lat, lng]);
      if (pan) mapB.panTo([lat, lng], { animate: true });
    }
    setLatLng(START[0], START[1]);
    markerD.on('dragend', () => { const p = markerD.getLatLng(); setLatLng(p.lat, p.lng); markerB.setLatLng(p); });
    mapD.on('click', e => { markerD.setLatLng(e.latlng); markerB.setLatLng(e.latlng); setLatLng(e.latlng.lat, e.latlng.lng); });

    // ===== 로그 =====
    function pad(n){ return String(n).padStart(2,'0'); }
    function now(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    function log(sideCls, sideLabel, title, ok, detail) {
      const el = document.createElement('div');
      el.className = 'log-item ' + (ok ? 'ok' : 'err');
      el.innerHTML = `<span class="t">${now()}</span> <span class="${sideCls}">[${sideLabel}]</span> ${title}\n${detail}`;
      $('log').prepend(el);
    }

    // ===== 모달 / 토스트 =====
    function showModal(kind, title, message, result) {
      const head = $('modalHead');
      head.className = 'modal-head ' + (kind === 'error' ? 'to-error' : kind === 'dreami' ? 'to-dreami' : 'to-boormi');
      head.textContent = title;
      $('modalBody').textContent = message;
      $('modalJson').textContent = result ? JSON.stringify(result, null, 2) : '';
      $('overlay').classList.remove('hidden');
    }
    $('modalClose').onclick = () => $('overlay').classList.add('hidden');
    $('overlay').onclick = e => { if (e.target === $('overlay')) $('overlay').classList.add('hidden'); };

    function showToast(text) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = text;
      $('toasts').appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    // ===== 화면 상태 반영 =====
    function applyResult(result) {
      if (!result) return;
      const meta = STATUS_META[result.status] || { label: result.status, cls: 's-none', cust: result.status };
      const badge = $('statusBadge');
      badge.className = 'badge ' + meta.cls;
      badge.textContent = meta.label;
      $('statusMsg').textContent = result.message ? '“' + result.message + '”' : '';
      // 부르미 화면(주문자 관점)
      $('bStatus').textContent = meta.cust;
      $('bSub').textContent = result.currentLocation
        ? `배달원 위치: ${Number(result.currentLocation.latitude).toFixed(5)}, ${Number(result.currentLocation.longitude).toFixed(5)}`
        : '위치 정보 없음';
      if (result.currentLocation) {
        const { latitude, longitude } = result.currentLocation;
        moveMarkers(latitude, longitude, true);
        setLatLng(latitude, longitude);
      }
    }

    // ===== API =====
    function orderId() { return $('orderId').value.trim(); }
    function requireOrder(sideCls, sideLabel) {
      if (!orderId()) { log(sideCls, sideLabel, '요청 취소', false, '먼저 [배달 시작]으로 orderId를 발급하세요.'); return false; }
      return true;
    }

    // action 메타: 로그 표기 주체(actor) + 응답 모달을 받을 대상(target)/문구
    async function call(action, path, body) {
      const opts = { method: 'POST', headers: {} };
      if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      try {
        const res = await fetch(path, opts);
        const env = await res.json();
        const ok = env.isSuccess === true;
        const detail = `<span class="${ok ? 'code-ok' : 'code-err'}">[HTTP ${res.status}] ${env.code} · ${env.message}</span>\n`
          + JSON.stringify(env.result, null, 2);
        log(action.actorCls, action.actorLabel, action.title, ok, detail);
        if (ok) applyResult(env.result);
        notify(action, ok, env);
        return env;
      } catch (e) {
        log(action.actorCls, action.actorLabel, action.title, false, '네트워크/파싱 오류: ' + e.message);
      }
    }

    // 응답 → 팝업 라우팅. 위치 업데이트는 토스트(자동모드 스팸 방지), 그 외는 모달.
    function notify(action, ok, env) {
      if (!ok) {
        showModal('error', `⚠️ 오류 · ${action.actorLabel}측`, `${env.code} · ${env.message}`, env.result);
        return;
      }
      if (action.key === 'location') {
        const l = env.result && env.result.currentLocation;
        showToast(l ? `🛰️ 배달원 위치 수신 → 부르미 지도 갱신 (${Number(l.latitude).toFixed(5)}, ${Number(l.longitude).toFixed(5)})`
                    : '🛰️ 위치 수신');
        return;
      }
      showModal(action.target, action.notifyTitle, action.notifyMsg, env.result);
    }

    // ===== 시딩 =====
    $('btnSeed').onclick = async () => {
      const res = await fetch('/api/v1/delivery/test/seed', { method: 'POST' });
      const env = await res.json();
      const ok = env.isSuccess === true;
      log('side-d', '시스템', '배달 시작 (seed)', ok,
        `<span class="${ok ? 'code-ok' : 'code-err'}">[HTTP ${res.status}] ${env.code} · ${env.message}</span>\n`
        + JSON.stringify(env.result, null, 2));
      if (!ok) return;
      const r = env.result;
      $('orderId').value = r.orderId;
      const meta = STATUS_META.PICKUP_NORMAL;
      $('statusBadge').className = 'badge ' + meta.cls;
      $('statusBadge').textContent = meta.label;
      $('statusMsg').textContent = '';
      $('bStatus').textContent = meta.cust;
      $('bSub').textContent = '배달원을 기다리는 중…';
      setLatLng(START[0], START[1]); moveMarkers(START[0], START[1], true);
      showToast('🆕 새 배달 시작: ' + r.orderId.slice(0, 8) + '…');
    };
    $('btnClear').onclick = () => { $('log').innerHTML = ''; };

    // ===== 위치 업데이트 =====
    const LOC = { key: 'location', title: '위치 업데이트', actorCls: 'side-d', actorLabel: '드리미' };
    function sendLocation() {
      if (!requireOrder('side-d', '드리미')) return;
      const lat = parseFloat($('lat').value), lng = parseFloat($('lng').value);
      const body = { latitude: isNaN(lat) ? null : lat, longitude: isNaN(lng) ? null : lng };
      return call(LOC, `/api/v1/delivery/orders/${orderId()}/dreami-location`, body);
    }
    $('btnLoc').onclick = sendLocation;

    // ===== 자동 이동(동쪽) =====
    let autoTimer = null;
    $('btnAuto').onclick = () => {
      const btn = $('btnAuto');
      if (autoTimer) {
        clearInterval(autoTimer); autoTimer = null;
        btn.classList.remove('toggle-on'); btn.textContent = '▶ 자동 이동(동쪽)';
        return;
      }
      if (!requireOrder('side-d', '드리미')) return;
      btn.classList.add('toggle-on'); btn.textContent = '⏸ 이동 중(동쪽)';
      const stepEast = () => {
        const lat = parseFloat($('lat').value) || START[0];
        const lng = (parseFloat($('lng').value) || START[1]) + AUTO_STEP; // 동쪽으로 전진
        setLatLng(lat, lng); moveMarkers(lat, lng, true);
        sendLocation();
      };
      stepEast();
      autoTimer = setInterval(stepEast, 5000);
    };

    // ===== 상태 전이 버튼 =====
    const ACTIONS = {
      pickup:       { key:'pickup', title:'픽업 완료', actorCls:'side-d', actorLabel:'드리미', path:'pickup-finish',
                      target:'boormi', notifyTitle:'🏠 부르미 알림', notifyMsg:'🛵 배달원이 픽업을 완료했어요! 배달이 시작됩니다.' },
      finish:       { key:'finish', title:'배달 완료', actorCls:'side-d', actorLabel:'드리미', path:'finish',
                      target:'boormi', notifyTitle:'🏠 부르미 알림', notifyMsg:'📦 배달이 완료되었어요! 맛있게 드세요.' },
      cancelDreami: { key:'cancelD', title:'취소 · 드리미', actorCls:'side-d', actorLabel:'드리미', path:'cancel/dreami',
                      target:'boormi', notifyTitle:'🏠 부르미 알림', notifyMsg:'❌ 배달원이 픽업을 취소했어요.' },
      cancelBoormi: { key:'cancelB', title:'취소 · 부르미', actorCls:'side-b', actorLabel:'부르미', path:'cancel/boormi',
                      target:'dreami', notifyTitle:'🛵 드리미 알림', notifyMsg:'❌ 주문자가 주문을 취소했어요.' },
      cancelAdmin:  { key:'cancelA', title:'취소 · 관리자', actorCls:'side-b', actorLabel:'관리자', path:'cancel/admin',
                      target:'error', notifyTitle:'⚠️ 관리자 취소', notifyMsg:'관리자가 배달을 취소했습니다.' },
    };
    function bind(btnId, actorCls, actorLabel, act) {
      $(btnId).onclick = () => {
        if (!requireOrder(actorCls, actorLabel)) return;
        call(act, `/api/v1/delivery/orders/${orderId()}/${act.path}`, undefined);
      };
    }
    bind('btnPickup',       'side-d', '드리미', ACTIONS.pickup);
    bind('btnFinish',       'side-d', '드리미', ACTIONS.finish);
    bind('btnCancelDreami', 'side-d', '드리미', ACTIONS.cancelDreami);
    bind('btnCancelBoormi', 'side-b', '부르미', ACTIONS.cancelBoormi);
    bind('btnCancelAdmin',  'side-b', '관리자', ACTIONS.cancelAdmin);
  </script>
</body>
</html>
