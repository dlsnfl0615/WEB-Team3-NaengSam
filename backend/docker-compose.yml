# 배포 서버용 백엔드 compose 파일.
# CI 가 DockerHub 에 올린 이미지를 pull 해서, .env 를 런타임에 주입해 실행한다.
# (이미지에는 시크릿이 들어있지 않다 — jar 만 들어있음)
#
# 모니터링(Prometheus·Grafana)은 이 파일에 없다. 별도 인스턴스에서 저장소 루트의
# monitoring/ 폴더로 따로 띄운다 — CI 를 타지 않고, 백엔드와 완전히 독립적이다.
#
# 사용법 (백엔드 서버에서):
#   1) 같은 폴더에 .env 를 둔다 (.env.example 참고, 실제 운영 값으로 채움)
#   2) docker compose pull   # 최신 이미지 받기
#   3) docker compose up -d   # 백그라운드 기동
#   4) docker compose logs -f # 로그 확인
#
# 이미지 태그/계정은 환경변수로 덮어쓸 수 있다:
#   DOCKERHUB_USERNAME=myid IMAGE_TAG=main docker compose up -d
#
# 모니터링 스택은 ../monitoring/README.md 참고.

services:
  backend:
    image: seoki/symboorm:${IMAGE_TAG:-main}
    container_name: symboorm-backend
    restart: always
    ports:
      - "8080:8080"   # API
      # 액츄에이터. 모니터링이 다른 인스턴스에 있으므로 호스트에 공개해야 한다.
      # EC2 는 공인 IP 를 IGW 가 NAT 하므로 바인딩 주소로는 막을 수 없다 —
      # 보안그룹에서 8081 을 모니터링 인스턴스 SG 로만 제한하는 것이 유일한 방어선이다.
      - "8081:8081"
    # application.properties 의 ${DATABASE_URL} 등을 이 파일 값으로 주입
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
