services:
  mysql:
    image: mysql:8.0
    container_name: symboorm-index-test-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: index-test-root
      MYSQL_DATABASE: symboorm_index_test
      MYSQL_USER: index_test
      MYSQL_PASSWORD: index-test
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - index-test-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  index-test-mysql-data:
