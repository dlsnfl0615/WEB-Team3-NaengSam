services:
  mysql:
    image: mysql:8.0
    container_name: symboorm-delivery-index-test-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: delivery-index-test-root
      MYSQL_DATABASE: symboorm_delivery_index_test
      MYSQL_USER: delivery_index_test
      MYSQL_PASSWORD: delivery-index-test
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - delivery-index-test-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  delivery-index-test-mysql-data:
